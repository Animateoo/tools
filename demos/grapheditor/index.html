<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>GraphEditor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="demo-embed.css">
</head>

<body>

    <div class="main-layout layout-vertical" id="mainLayout">

        <div class="primary-column curve-family-graph" id="primaryColumn">

            <div class="curve-type-bar" id="curveTypeBar" title="Tipo de curva">
                <button type="button" class="curve-type-btn active" data-curve="graph" id="curveTypeGraph" title="Graph">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18V6M3 12h4l4-6 4 9 4-3h4"/></svg>
                </button>
                <button type="button" class="curve-type-btn" data-curve="elastic" title="Elastic">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18c4-14 8 14 18-14"/></svg>
                </button>
                <button type="button" class="curve-type-btn" data-curve="bounce" title="Bounce">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18V8M3 8c3-3 5 6 7-2c2 4 4-4 6 0c2-3 4 8 8-2"/></svg>
                </button>
                <button type="button" class="curve-type-btn" data-curve="wave" title="Wave">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12c2-5 4 5 6 0s4-5 6 0 4 5 6 0"/></svg>
                </button>
                <button type="button" class="curve-type-btn" data-curve="step" title="Step">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18V12h6V8h6V4h6"/></svg>
                </button>
            </div>

            <div class="mode-selector" id="modeSelectorRow">
                <button class="mode-btn active" id="btnModeVelocity">CURVE</button>
                <button class="mode-btn" id="btnModeValue">VALUE</button>
            </div>

            <div class="mode-selector apply-method-row" id="applyMethodRow" style="display:none;" title="Método">
                <button class="mode-btn active" id="btnApplyExpr" data-method="expr" title="Expresión">fx EXPR</button>
                <button class="mode-btn" id="btnApplyKeys" data-method="keys" title="Keyframes">◆ KEYS</button>
            </div>

            <div class="graph-container" id="graphContainer">
                <svg id="speedGraphSVG" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet">
                    <g id="graphGrid">
                        <path id="gridPath" class="graph-grid-line" d="" />
                        <path id="gridPathMajor" class="graph-grid-major" d="" />
                    </g>

                    <line id="graphBaseLeft" class="graph-base-left" x1="0" y1="140" x2="150" y2="140" />
                    <line id="graphBaseRight" class="graph-base-right" x1="150" y1="140" x2="300" y2="140" />

                    <path id="graphFill" class="graph-fill" d="" />
                    <path id="graphCurve" class="graph-curve" d="" />
                    <line id="handleLineLeft" class="graph-handle-line" x1="0" y1="140" x2="50" y2="140" />
                    <line id="handleLineRight" class="graph-handle-line" x1="250" y1="140" x2="300" y2="140" />

                    <g id="dragGroupLeft" style="cursor: move;">
                        <rect id="dragAreaLeft" x="40" y="125" width="30" height="30" fill="transparent" />
                        <circle id="handlePointLeft" class="graph-handle-point" cx="50" cy="140" r="4.5" />
                    </g>
                    <g id="dragGroupRight" style="cursor: move;">
                        <rect id="dragAreaRight" x="230" y="125" width="30" height="30" fill="transparent" />
                        <circle id="handlePointRight" class="graph-handle-point" cx="250" cy="140" r="4.5" />
                    </g>

                    <!-- Optional guide (toggle) -->
                    <line id="graphGuideVertical" class="graph-guide-vertical" x1="150" y1="-2000" x2="150" y2="2000"
                        style="display:none;" />
                    <circle id="graphGuideDot" class="graph-guide-dot" cx="150" cy="20" r="4" style="display:none;" />
                    <g id="customHandleLayer"></g>
                </svg>
            </div>

            <div class="controls-section compact-mode">
                <!-- Hidden legacy controls (kept for internal state) -->
                <div style="display:none;">
                    <div id="outValDisplay">50%</div>
                    <input type="range" id="sliderOut" min="0.1" max="100" value="50" step="0.1">
                    <div id="inValDisplay">50%</div>
                    <input type="range" id="sliderIn" min="0.1" max="100" value="50" step="0.1">
                </div>

                <div class="tools-row">
                    <div class="tools-box tools-box--keys">
                        <div class="kf-btn kf-btn--sm" data-type="linear" title="Linear">
                            <img src="icons/linear.svg" draggable="false">
                        </div>
                        <div class="kf-btn kf-btn--sm" data-type="bezier" title="Bezier">
                            <img src="icons/bezier.svg" draggable="false">
                        </div>
                        <div class="kf-btn kf-btn--sm" data-type="hold" title="Hold">
                            <img src="icons/hold.svg" draggable="false">
                        </div>
                        <div class="kf-btn kf-btn--sm preset-trigger" data-out="33.3" data-in="33.3" title="Easy Ease">
                            <img src="icons/easyease.svg" draggable="false">
                        </div>

                        <div class="separator-vertical kf-tools-sep" aria-hidden="true"></div>

                        <button type="button" class="icon-btn icon-btn--toolbar" id="reverseBtn" title="Reverse">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="17 1 21 5 17 9"></polyline>
                                <line x1="3" y1="5" x2="21" y2="5"></line>
                                <polyline points="7 15 3 19 7 23"></polyline>
                                <line x1="21" y1="19" x2="3" y2="19"></line>
                            </svg>
                        </button>
                        <button type="button" class="icon-btn icon-btn--toolbar" id="resetBtn" title="Reset">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 4 3 10 9 10"></polyline>
                                <path d="M3.5 10a9 9 0 1 1 2.6 6.9"></path>
                            </svg>
                        </button>
                        <div class="separator-vertical kf-tools-sep" aria-hidden="true"></div>
                        <button type="button" class="icon-btn icon-btn--toolbar" id="presetsConfigBtn" title="Presets">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="7" height="7"></rect>
                                <rect x="14" y="3" width="7" height="7"></rect>
                                <rect x="3" y="14" width="7" height="7"></rect>
                                <rect x="14" y="14" width="7" height="7"></rect>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Propiedades (solo Premiere) -->
            <div class="filter-row filter-row--mid is-empty" id="filterRow"></div>

            <div class="action-buttons-container">
                <button id="cleanBtn" class="copy-btn hist-btn" title="Limpiar curva" style="display:none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                        <path d="M10 11v6"></path>
                        <path d="M14 11v6"></path>
                        <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
                <button id="copyBtn" class="copy-btn" title="Traer de AE">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
                <button id="applyBtn" class="apply-btn">APLICAR</button>
            </div>
        </div>

        <!-- Resize Gutter (drag to resize graph vs presets) -->
        <div class="resize-gutter" id="resizeGutter" style="display:none;" title="Arrastra para redimensionar">
            <div class="gutter-handle"></div>
        </div>

        <!-- Presets Panel -->
        <div class="presets-panel is-collapsed" id="presetsPanel">
            <div class="presets-toolbar">
                <div class="presets-header" id="presetsToggle">
                    <span class="presets-title">PRESETS</span>
                </div>
                <div class="presets-toolbar-actions">
                    <button type="button" class="preset-toolbar-btn preset-toolbar-fav" id="presetFavToggleBtn" title="Marcar/quitar favorito">★</button>
                    <button type="button" class="preset-toolbar-btn" id="addPresetBtn" title="Guardar preset">+</button>
                    <button type="button" class="preset-toolbar-btn" id="removePresetBtn" title="Borrar preset">−</button>
                </div>
            </div>
            <div class="presets-filter-row" id="presetsFilterRow">
                <button type="button" class="preset-filter-tab active" id="presetFilterAll">TODOS</button>
                <button type="button" class="preset-filter-tab" id="presetFilterFav">FAVORITOS</button>
            </div>
            <div class="presets-scroll-container" id="presetsScroll">
                <div class="presets-grid" id="presetsGrid"></div>
            </div>
        </div>

        <!-- Modal: New Preset Name -->
        <div id="presetNameModal" class="ge-modal-overlay" style="display:none;">
            <div class="ge-modal">
                <h3 class="ge-modal-title">Nuevo preset</h3>
                <input type="text" id="presetNameInput" class="ge-modal-input" maxlength="64" placeholder="Nombre del preset" />
                <div class="ge-modal-actions">
                    <button type="button" class="ge-modal-btn ge-modal-btn-secondary" id="presetNameCancel">Cancelar</button>
                    <button type="button" class="ge-modal-btn ge-modal-btn-primary" id="presetNameOk">Guardar</button>
                </div>
            </div>
        </div>

    </div>

    <script src="CSInterface.js"></script>
    <script src="main.js"></script>
</body>

</html>
