<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool | Animateo</title>
    <meta name="description" content="">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/tools-pages.css">
    <link rel="stylesheet" href="../css/v3-rebrand.css">
    <script>window.TOOL_SLUG = 'compvault';</script>
</head>
<body class="tools-body home-contrast tool-page">
    <div class="home-dark">
        <header class="tools-header home-header">
            <div class="tools-container tools-header-inner">
                <a class="tools-logo" href="../">Animateo</a>
                <nav class="tools-nav">
                    <a href="../">Tools</a>
                    <a href="../guides/">Guides</a>
                    <a href="https://github.com/Animateoo" target="_blank" rel="noopener">GitHub</a>
                    <a href="https://www.behance.net/animateoo" target="_blank" rel="noopener">Portfolio</a>
                </nav>
            </div>
        </header>

        <section class="tool-hero-compact tools-container">
            <a class="tool-back" href="../">← Todas las tools</a>
            <div class="tool-hero-compact-row">
                <div>
                    <span class="tool-detail-tag" id="toolTag"></span>
                    <h1 id="toolTitle"></h1>
                </div>
                <div class="tool-repo-switch" id="repoSwitch"></div>
            </div>
        </section>
    </div>

    <div class="home-light">
        <main class="tool-detail-main">
            <div class="tools-container">
                <h2 class="tool-playground-label">Pruébalo</h2>
                <section class="tool-playground" aria-label="Demo e información">
                    <div id="tryitMount"></div>
                    <aside class="tool-info-card" id="toolInfoCard">
                        <span class="tool-info-index" id="toolIndex"></span>
                        <h2 id="toolInfoTitle"></h2>
                        <p class="tool-info-sub" id="toolInfoSub"></p>
                        <p class="tool-info-desc" id="toolDesc"></p>
                        <ul class="tool-info-features" id="toolFeatures"></ul>
                        <div class="tool-detail-actions" id="toolActions"></div>
                        <a class="btn-3d btn-3d--ghost tool-info-guides" href="../guides/">Abrir Guides →</a>
                    </aside>
                </section>

                <section class="tool-faq">
                    <h2>Preguntas frecuentes</h2>
                    <div class="faq-list" id="faqList"></div>
                </section>

                <section class="tool-cta">
                    <h2 id="ctaTitle"></h2>
                    <p id="ctaDesc"></p>
                    <a class="btn-3d btn-3d--primary" id="ctaDownload" target="_blank" rel="noopener">Descargar</a>
                </section>
            </div>
        </main>
    </div>

    <footer class="tools-footer home-footer">
        <div class="tools-container home-footer-copy">
            <p>&copy; 2026 Animateo Tools. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/tools-data.js"></script>
    <script src="../js/tool-page.js"></script>
</body>
</html>
